# Example Game Server Pod Created by Wings
#
# This is an example of what a game server Pod looks like when created by the
# Kubernetes provider. Wings will generate these specifications dynamically based
# on the server configuration from the Panel.
#
# This file is for reference only - Wings creates these resources automatically.
# You do not need to apply this file manually.
#
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wings-server-example-uuid-data
  namespace: pterodactyl-servers
  labels:
    app: pterodactyl-wings
    pterodactyl/server-id: example-uuid
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wings-server-example-uuid
  namespace: pterodactyl-servers
  labels:
    app: pterodactyl-wings
    pterodactyl/server-id: example-uuid
spec:
  type: NodePort
  selector:
    app: pterodactyl-wings
    pterodactyl/server-id: example-uuid
  ports:
    # Minecraft example port
    - name: port-25565
      protocol: TCP
      port: 25565
      targetPort: 25565
      # NodePort will be auto-assigned by Kubernetes
---
apiVersion: v1
kind: Pod
metadata:
  name: wings-server-example-uuid
  namespace: pterodactyl-servers
  labels:
    app: pterodactyl-wings
    pterodactyl/server-id: example-uuid
    pterodactyl/server-uuid: example-uuid
  annotations:
    pterodactyl/image: "ghcr.io/pterodactyl/yolks:java_17"
    pterodactyl/created: "2024-01-01T00:00:00Z"
spec:
  restartPolicy: Never  # Wings manages lifecycle
  serviceAccountName: wings-server-manager
  
  securityContext:
    fsGroup: 1000  # pterodactyl group
  
  containers:
    - name: server
      image: ghcr.io/pterodactyl/yolks:java_17
      
      # Working directory
      workingDir: /home/container
      
      # Interactive console support
      stdin: true
      tty: true
      
      # Environment variables
      env:
        - name: SERVER_MEMORY
          value: "1024"
        - name: SERVER_IP
          value: "0.0.0.0"
        - name: SERVER_PORT
          value: "25565"
        - name: TZ
          value: "UTC"
      
      # Resource limits
      resources:
        requests:
          memory: "1024Mi"
          cpu: "1000m"  # 100% = 1 core
        limits:
          memory: "1024Mi"
      
      # Volume mounts
      volumeMounts:
        - name: server-data
          mountPath: /home/container
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  
  volumes:
    - name: server-data
      persistentVolumeClaim:
        claimName: wings-server-example-uuid-data
